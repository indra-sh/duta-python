[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "duta-sdk"
version = "0.2.0"
description = "The official Python SDK for Duta, transactional email for Malaysia."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Duta" }]
requires-python = ">=3.9"
dependencies = ["httpx>=0.25,<1"]
keywords = ["duta", "email", "transactional-email", "malaysia", "resend-alternative"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Communications :: Email",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://docs.duta.indra.sh/sdks/"
Documentation = "https://docs.duta.indra.sh"
Source = "https://github.com/indra-sh/duta-python"
Issues = "https://github.com/indra-sh/duta-python/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21", "pytest-asyncio>=0.23"]

[tool.hatch.build.targets.wheel]
packages = ["src/duta"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
